name: atiempo_mobile_app
description: "Prototipo móvil de a tiempo, una aplicación para acompañar el tratamiento de medicamentos en casa."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  go_router: 18.0.1

dev_dependencies:
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  flutter_native_splash: 2.4.8
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/atkinson_hyperlegible_next/OFL.txt

  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/atkinson_hyperlegible_next/AtkinsonHyperlegibleNext-Light.ttf
          weight: 300
        - asset: assets/fonts/atkinson_hyperlegible_next/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: assets/fonts/atkinson_hyperlegible_next/AtkinsonHyperlegibleNext-Medium.ttf
          weight: 500
        - asset: assets/fonts/atkinson_hyperlegible_next/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
